<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Self-Evaluation Tracker</title>
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px 25px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .date-picker {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .date-picker input {
            font-size: 1rem;
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            color: #1e293b;
        }
        .frames {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }
        .frame-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }
        .frame-label {
            font-weight: 600;
            color: #0f172a;
            width: 120px;
            font-size: 0.95rem;
        }
        .frame-credits {
            font-size: 0.8rem;
            color: #475569;
            background: #e2e8f0;
            border-radius: 20px;
            padding: 2px 10px;
            white-space: nowrap;
        }
        .score-input {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .score-input input[type="range"] {
            flex: 1;
            accent-color: #2563eb;
        }
        .score-input span {
            font-weight: 700;
            min-width: 32px;
            text-align: center;
            color: #1e293b;
        }
        .earned-credit {
            font-weight: 600;
            color: #0f172a;
            background: #dbeafe;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
        }
        .total-box {
            background: #2563eb;
            color: white;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .total-value {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        button {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #1e293b;
            background: #fff;
        }
        button.primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        button.primary:hover {
            background: #1d4ed8;
        }
        .history-table {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th {
            background: #f1f5f9;
            color: #1e293b;
            padding: 10px 8px;
            font-size: 0.8rem;
            text-align: center;
        }
        td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }
        .delete-btn {
            background: #fee2e2;
            border: none;
            color: #b91c1c;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .summary {
            margin: 10px 0 20px;
            font-weight: 500;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Daily Self-Evaluation</h1>
    <div class="subtitle">Rate your timeframes (0–10) · Credits: Pre‑College 8 | College 10 | Post‑College 7</div>

    <!-- Date picker -->
    <div class="date-picker">
        <input type="date" id="evalDate">
    </div>

    <!-- Evaluation cards -->
    <div class="frames" id="framesContainer">
        <!-- Dynamic via JS -->
    </div>

    <!-- Total credits display -->
    <div class="total-box">
        <span>Today's Total Credits</span>
        <span class="total-value" id="totalCreditsDisplay">0 / 25</span>
    </div>

    <!-- Action buttons -->
    <div class="buttons">
        <button class="primary" id="saveBtn">💾 Save / Update</button>
        <button id="exportCsvBtn">📥 Export CSV</button>
        <button id="exportPdfBtn">📄 Export PDF</button>
        <button id="clearAllBtn" style="color:#b91c1c; border-color:#fecaca;">🗑 Clear All Data</button>
    </div>

    <!-- History / Saved data -->
    <div class="summary" id="avgSummary"></div>
    <div class="history-table">
        <table id="historyTable">
            <thead>
            <tr>
                <th>Date</th>
                <th>Pre<br>(0-10)</th>
                <th>College<br>(0-10)</th>
                <th>Post<br>(0-10)</th>
                <th>Pre Credits</th>
                <th>College Credits</th>
                <th>Post Credits</th>
                <th>Total</th>
                <th></th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    (function() {
        // ---------- CONFIG ----------
        const FRAMES = [
            { id: 'pre', label: 'Pre-College', maxCredits: 8 },
            { id: 'college', label: 'College', maxCredits: 10 },
            { id: 'post', label: 'Post-College', maxCredits: 7 }
        ];
        const STORAGE_KEY = 'selfEvalData';

        // DOM elements
        const dateInput = document.getElementById('evalDate');
        const framesContainer = document.getElementById('framesContainer');
        const totalCreditsDisplay = document.getElementById('totalCreditsDisplay');
        const saveBtn = document.getElementById('saveBtn');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const historyTableBody = document.querySelector('#historyTable tbody');
        const avgSummary = document.getElementById('avgSummary');

        // State
        let allData = [];                 // Array of { date, pre, college, post }
        let currentScores = { pre: 5, college: 5, post: 5 };  // default sliders

        // ---------- INITIALIZE ----------
        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    allData = JSON.parse(stored);
                } catch (e) {
                    allData = [];
                }
            }
            // Sort by date descending
            allData.sort((a, b) => (a.date < b.date ? 1 : -1));
        }

        function saveAllData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
        }

        // Set today's date in input
        function setToday() {
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }

        // Build slider cards
        function renderFrames() {
            framesContainer.innerHTML = '';
            FRAMES.forEach(frame => {
                const card = document.createElement('div');
                card.className = 'frame-card';
                card.innerHTML = `
                    <div class="frame-label">${frame.label}</div>
                    <div class="frame-credits">max ${frame.maxCredits} credits</div>
                    <div class="score-input">
                        <input type="range" min="0" max="10" value="${currentScores[frame.id]}" data-frame="${frame.id}">
                        <span>${currentScores[frame.id]}</span>
                    </div>
                    <div class="earned-credit" id="credit-${frame.id}">
                        ${ (currentScores[frame.id] / 10 * frame.maxCredits).toFixed(1) } cr
                    </div>
                `;
                framesContainer.appendChild(card);
            });

            // Attach event listeners to sliders
            document.querySelectorAll('.score-input input[type="range"]').forEach(slider => {
                slider.addEventListener('input', function(e) {
                    const frameId = this.dataset.frame;
                    const val = parseInt(this.value, 10);
                    currentScores[frameId] = val;
                    // update displayed number
                    this.nextElementSibling.textContent = val;
                    // update earned credit display
                    const frameCfg = FRAMES.find(f => f.id === frameId);
                    const earned = (val / 10 * frameCfg.maxCredits).toFixed(1);
                    document.getElementById(`credit-${frameId}`).textContent = earned + ' cr';
                    // update total
                    updateTotalDisplay();
                });
            });

            updateTotalDisplay();
        }

        function updateTotalDisplay() {
            const total = FRAMES.reduce((sum, frame) => {
                return sum + (currentScores[frame.id] / 10 * frame.maxCredits);
            }, 0);
            totalCreditsDisplay.textContent = total.toFixed(1) + ' / 25';
        }

        // Fill sliders from an existing entry for the selected date
        function loadEntryForDate(date) {
            const entry = allData.find(e => e.date === date);
            if (entry) {
                currentScores = { pre: entry.pre, college: entry.college, post: entry.post };
            } else {
                currentScores = { pre: 5, college: 5, post: 5 };
            }
            renderFrames();
        }

        // ---------- HISTORY TABLE ----------
        function renderHistory() {
            historyTableBody.innerHTML = '';
            if (allData.length === 0) {
                historyTableBody.innerHTML = '<tr><td colspan="9" style="padding:20px; color:#64748b;">No entries yet. Start by saving a day!</td></tr>';
                updateSummary();
                return;
            }

            allData.forEach(entry => {
                const preCred = (entry.pre / 10 * 8).toFixed(1);
                const colCred = (entry.college / 10 * 10).toFixed(1);
                const postCred = (entry.post / 10 * 7).toFixed(1);
                const total = (parseFloat(preCred) + parseFloat(colCred) + parseFloat(postCred)).toFixed(1);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${entry.date}</td>
                    <td>${entry.pre}</td>
                    <td>${entry.college}</td>
                    <td>${entry.post}</td>
                    <td>${preCred}</td>
                    <td>${colCred}</td>
                    <td>${postCred}</td>
                    <td><strong>${total}</strong></td>
                    <td><button class="delete-btn" data-date="${entry.date}">🗑</button></td>
                `;
                historyTableBody.appendChild(row);
            });

            // Delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const dateToDelete = this.dataset.date;
                    allData = allData.filter(e => e.date !== dateToDelete);
                    saveAllData();
                    renderHistory();
                    // If currently selected date is the deleted one, reset form
                    if (dateInput.value === dateToDelete) {
                        loadEntryForDate(dateInput.value);
                    }
                });
            });

            updateSummary();
        }

        function updateSummary() {
            if (allData.length === 0) {
                avgSummary.textContent = '';
                return;
            }
            const totalCreditsSum = allData.reduce((acc, entry) => {
                const preC = entry.pre / 10 * 8;
                const colC = entry.college / 10 * 10;
                const postC = entry.post / 10 * 7;
                return acc + preC + colC + postC;
            }, 0);
            const avg = (totalCreditsSum / allData.length).toFixed(1);
            avgSummary.innerHTML = `📈 <strong>${allData.length}</strong> day(s) recorded · Average daily credits: <strong>${avg}</strong> / 25`;
        }

        // ---------- SAVE / UPDATE ----------
        function saveCurrentEntry() {
            const date = dateInput.value;
            if (!date) {
                alert('Please select a date.');
                return;
            }
            const newEntry = {
                date: date,
                pre: currentScores.pre,
                college: currentScores.college,
                post: currentScores.post
            };

            // Replace if exists, otherwise add
            const index = allData.findIndex(e => e.date === date);
            if (index !== -1) {
                allData[index] = newEntry;
            } else {
                allData.push(newEntry);
            }

            // Re-sort by date descending
            allData.sort((a, b) => (a.date < b.date ? 1 : -1));
            saveAllData();
            renderHistory();
            alert('Entry saved/updated!');
        }

        // ---------- EXPORT CSV ----------
        function exportCSV() {
            if (allData.length === 0) {
                alert('No data to export.');
                return;
            }
            let csvContent = "Date,Pre Score,College Score,Post Score,Pre Credits (max8),College Credits (max10),Post Credits (max7),Total Credits\n";
            allData.forEach(entry => {
                const preC = (entry.pre / 10 * 8).toFixed(1);
                const colC = (entry.college / 10 * 10).toFixed(1);
                const postC = (entry.post / 10 * 7).toFixed(1);
                const total = (parseFloat(preC) + parseFloat(colC) + parseFloat(postC)).toFixed(1);
                csvContent += `${entry.date},${entry.pre},${entry.college},${entry.post},${preC},${colC},${postC},${total}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `self_eval_${new Date().toISOString().slice(0,10)}.csv`);
            link.click();
            URL.revokeObjectURL(url);
        }

        // ---------- EXPORT PDF ----------
        function exportPDF() {
            if (allData.length === 0) {
                alert('No data to export.');
                return;
            }
            if (!window.jspdf || typeof window.jspdf.jsPDF !== 'function') {
                alert('PDF library failed to load. Please refresh and try again.');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text('Self-Evaluation Report', 14, 20);
            doc.setFontSize(10);
            doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);

            const headers = [['Date', 'Pre', 'College', 'Post', 'Pre Cr', 'Col Cr', 'Post Cr', 'Total']];
            const rows = allData.map(entry => {
                const preC = (entry.pre / 10 * 8).toFixed(1);
                const colC = (entry.college / 10 * 10).toFixed(1);
                const postC = (entry.post / 10 * 7).toFixed(1);
                const total = (parseFloat(preC) + parseFloat(colC) + parseFloat(postC)).toFixed(1);
                return [entry.date, entry.pre, entry.college, entry.post, preC, colC, postC, total];
            });

            if (typeof doc.autoTable !== 'function') {
                alert('PDF table plugin failed to load. Please refresh and try again.');
                return;
            }

            doc.autoTable({
                head: headers,
                body: rows,
                startY: 35,
                styles: { fontSize: 9, cellPadding: 2 },
                headStyles: { fillColor: [37, 99, 235] },
            });

            doc.save(`self_eval_report_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        // ---------- CLEAR ALL ----------
        function clearAll() {
            if (confirm('Delete ALL saved evaluations? This cannot be undone.')) {
                allData = [];
                saveAllData();
                renderHistory();
                loadEntryForDate(dateInput.value);
            }
        }

        // ---------- EVENT LISTENERS ----------
        dateInput.addEventListener('change', function() {
            loadEntryForDate(this.value);
        });

        saveBtn.addEventListener('click', saveCurrentEntry);
        exportCsvBtn.addEventListener('click', exportCSV);
        exportPdfBtn.addEventListener('click', exportPDF);
        clearAllBtn.addEventListener('click', clearAll);

        // ---------- START ----------
        loadData();
        setToday();
        loadEntryForDate(dateInput.value);
        renderHistory();
    })();
</script>
</body>
</html>
